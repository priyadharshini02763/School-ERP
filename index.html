<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
        .glass-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .active-nav { background: #EEF2FF; color: #4F46E5; border-right: 3px solid #4F46E5; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4F46E5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <section id="loginSection" class="fixed inset-0 bg-slate-900 z-50 flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h1 class="text-3xl font-bold text-center mb-6 text-indigo-900">College ERP</h1>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="uid" placeholder="Email or Mobile" class="w-full border p-3 mb-4 rounded" required>
                <input type="password" id="pass" placeholder="Password" class="w-full border p-3 mb-2 rounded" required>
                <div class="text-right mb-4"><a href="#" onclick="toggleModal('forgotModal')" class="text-xs text-indigo-600 font-bold hover:underline">Forgot Password?</a></div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded">LOGIN</button>
            </form>
            <div class="mt-4 text-center"><a href="#" onclick="showRegister()" class="text-sm text-indigo-600 font-bold">New Student? Register</a></div>
        </div>
    </section>

    <section id="registerSection" class="fixed inset-0 bg-slate-100 z-50 flex justify-center items-center hidden overflow-y-auto">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl my-10">
            <h2 class="text-2xl font-bold mb-6">Student Admission</h2>
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input name="email" placeholder="Email" class="border p-2 rounded" required>
                    <input name="mobile" placeholder="Mobile" class="border p-2 rounded" required>
                    <input name="password" placeholder="Password" type="password" class="border p-2 rounded col-span-2" required>
                    <input name="regNo" placeholder="Reg No" class="border p-2 rounded" required>
                    <input name="fullName" placeholder="Full Name" class="border p-2 rounded" required>
                    <select name="course" class="border p-2 rounded bg-white"><option>BCA</option><option>BSC</option><option>B.COM</option></select>
                    <input name="year" placeholder="Year" type="number" class="border p-2 rounded" required>
                    <input name="guardianName" placeholder="Guardian Name" class="border p-2 rounded" required>
                    <input name="guardianContact" placeholder="Guardian Contact" class="border p-2 rounded" required>
                </div>
                <div class="flex gap-4 mt-4">
                    <button type="button" onclick="location.reload()" class="w-1/2 border py-2 rounded">Cancel</button>
                    <button type="submit" id="regBtn" class="w-1/2 bg-indigo-600 text-white py-2 rounded">Register</button>
                </div>
            </form>
        </div>
    </section>

    <aside class="w-64 bg-white border-r flex flex-col">
        <div class="h-16 flex items-center px-6 border-b font-bold text-xl text-indigo-600">College ERP</div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar"></nav>
        <div class="p-4 border-t"><button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 font-bold">Logout</button></div>
    </aside>

    <main class="flex-1 flex flex-col bg-slate-50">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8">
            <h2 id="pageTitle" class="text-lg font-bold">Dashboard</h2>
            <div id="userDisplay" class="font-bold text-sm">User</div>
        </header>
        <div id="content" class="flex-1 overflow-auto p-8"></div>
    </main>

    <div id="forgotModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-96">
            <h3 class="font-bold text-lg mb-4">Reset Password</h3>
            <p class="text-sm text-gray-500 mb-4">Enter your registered email to receive a reset link.</p>
            <input id="forgotEmail" placeholder="Enter Email" class="w-full border p-2 rounded mb-4" required>
            <button onclick="handleForgotSubmit()" class="bg-indigo-600 text-white w-full py-2 rounded">Send Link</button>
            <button onclick="toggleModal('forgotModal')" class="w-full py-2 text-gray-500 mt-2">Cancel</button>
        </div>
    </div>

    <div id="resetScreen" class="hidden fixed inset-0 bg-slate-900 z-50 flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h1 class="text-2xl font-bold text-center mb-6">Set New Password</h1>
            <form onsubmit="handleResetNew(event)">
                <input type="password" id="newResetPass" placeholder="New Password" class="w-full border p-3 mb-4 rounded" required>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded">Update Password</button>
            </form>
        </div>
    </div>

    <div id="teacherModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-[400px]">
            <h3 class="font-bold mb-4">Add Teacher</h3>
            <form onsubmit="submitTeacher(event)" class="space-y-3"><input name="fullName" placeholder="Name" class="w-full border p-2 rounded" required><input name="email" placeholder="Email" class="w-full border p-2 rounded" required><input name="mobile" placeholder="Mobile" class="w-full border p-2 rounded" required><input name="subject" placeholder="Subject" class="w-full border p-2 rounded" required><input name="qualification" placeholder="Qualification" class="w-full border p-2 rounded" required><button class="bg-indigo-600 text-white w-full py-2 rounded">Add</button></form>
            <button onclick="document.getElementById('teacherModal').classList.add('hidden')" class="w-full mt-2 text-gray-500">Cancel</button>
        </div>
    </div>
    <div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-[400px]"><h3 class="font-bold mb-4">Edit</h3><form onsubmit="submitEdit(event)" class="space-y-3"><input type="hidden" id="editId" name="id"><input type="hidden" id="editType" name="type"><input id="editName" name="name" class="w-full border p-2 rounded"><input id="editMobile" name="mobile" class="w-full border p-2 rounded"><input id="editExtra" name="extra" class="w-full border p-2 rounded"><button class="bg-green-600 text-white w-full py-2 rounded">Update</button></form><button onclick="document.getElementById('editModal').classList.add('hidden')" class="w-full mt-2 text-gray-500">Cancel</button></div>
    </div>
    <div id="uploadModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center"><div class="bg-white p-6 rounded-lg w-[400px]"><h3 class="font-bold mb-4">Upload File</h3><input type="hidden" id="uploadType"><input type="file" id="fileInput" class="w-full border p-2 mb-4" accept=".xlsx,.csv"><button onclick="processFile()" class="bg-green-600 text-white w-full py-2 rounded">Upload</button><button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="mt-2 w-full text-gray-500">Cancel</button></div></div>
    <div id="emailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center"><div class="bg-white p-6 rounded-lg w-[500px]"><h3 class="font-bold mb-4">Send Email</h3><form onsubmit="sendEmail(event)"><select name="target" class="w-full border p-2 mb-2"><option value="all_students">All Students</option><option value="all_teachers">All Teachers</option></select><input name="subject" placeholder="Subject" class="w-full border p-2 mb-2" required><textarea name="body" rows="4" placeholder="Message" class="w-full border p-2 mb-4" required></textarea><div class="flex justify-end gap-2"><button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2">Cancel</button><button class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button></div></form></div></div>

    <script>
        // 🟢 UPDATE URL 🟢
        const API_URL = "https://script.google.com/macros/s/AKfycbwk4P4Q9DZDJ6ebGI64QLcGw5HONeBhUqDQ5wSnoSSZZ39icw5wxXGgr_3ggtpgplQ/exec";
        
        let currentUser = JSON.parse(localStorage.getItem('user'));
        let cache = {};

        // --- INIT & RESET CHECK ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('resetToken')) {
                // Show Reset Screen
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('resetScreen').classList.remove('hidden');
                window.resetToken = params.get('resetToken');
                window.resetEmail = params.get('email');
            } else if (currentUser) {
                initApp();
            }
        };

        function showRegister() { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('registerSection').classList.remove('hidden'); }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        // --- AUTH ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn'); btn.innerText = "Verifying...";
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', uid: document.getElementById('uid').value, pass: document.getElementById('pass').value }) });
                const data = await res.json();
                if(data.success) { localStorage.setItem('user', JSON.stringify(data)); location.reload(); } else { alert(data.message); btn.innerText = "LOGIN"; }
            } catch(e) { alert("Error"); btn.innerText = "LOGIN"; }
        }

        async function handleRegister(e) {
            e.preventDefault();
            document.getElementById('regBtn').innerText = "Processing...";
            const fd = new FormData(e.target); const d = { action: 'registerStudent' }; fd.forEach((v,k)=>d[k]=v);
            const res = await fetch(API_URL, {method:'POST', body:JSON.stringify(d)});
            const r = await res.json();
            alert(r.message); if(r.success) location.reload();
        }

        // --- PASSWORD RESET ---
        async function handleForgotSubmit() {
            const email = document.getElementById('forgotEmail').value;
            if(!email) return alert("Enter email");
            
            // Pass the current URL so backend can construct the link
            const frontendUrl = window.location.href.split('?')[0]; 
            
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'forgotPassword', email: email, frontendUrl: frontendUrl }) });
            alert("If the email exists, a reset link has been sent.");
            toggleModal('forgotModal');
        }

        async function handleResetNew(e) {
            e.preventDefault();
            const newPass = document.getElementById('newResetPass').value;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'resetPasswordWithToken', email: window.resetEmail, token: window.resetToken, newPass: newPass }) });
            const data = await res.json();
            alert(data.message);
            if(data.success) window.location.href = window.location.pathname; // Reload to login
        }

        async function changePass(e) {
            e.preventDefault();
            const fd = new FormData(e.target); const d={action:'changePassword', userId: currentUser.userId, role: currentUser.role}; fd.forEach((v,k)=>d[k]=v);
            const res = await fetch(API_URL, {method:'POST', body:JSON.stringify(d)});
            const r = await res.json(); alert(r.message); e.target.reset();
        }

        // --- DASHBOARD ---
        function initApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userDisplay').innerText = `${currentUser.name} (${currentUser.role})`;
            
            const menu = currentUser.role === 'Admin' || currentUser.role === 'Teacher'
                ? [
                    {id:'home',icon:'fa-chart-pie',l:'Dashboard'}, 
                    {id:'students',icon:'fa-user-graduate',l:'Students'}, 
                    {id:'teachers',icon:'fa-chalkboard-user',l:'Teachers'}, 
                    {id:'approvals',icon:'fa-check',l:'Approvals'}, 
                    {id:'attendance',icon:'fa-calendar-check',l:'Attendance'},
                    {id:'results',icon:'fa-file-alt',l:'Results'},
                    {id:'communication',icon:'fa-envelope',l:'Communication'},
                    {id:'settings',icon:'fa-cog',l:'Settings'}
                  ]
                : [{id:'home',icon:'fa-home',l:'My Dashboard'}, {id:'my-performance',icon:'fa-chart-line',l:'My Performance'}, {id:'settings',icon:'fa-cog',l:'Settings'}];

            const nav = document.getElementById('sidebar');
            nav.innerHTML = menu.map(m => `<button onclick="loadPage('${m.id}')" id="btn-${m.id}" class="w-full text-left px-6 py-3 hover:bg-slate-100 flex items-center gap-3"><i class="fa-solid ${m.icon}"></i> ${m.l}</button>`).join('');
            loadPage('home');
        }

        function loadPage(id) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(`btn-${id}`)?.classList.add('active-nav');
            document.getElementById('pageTitle').innerText = id.charAt(0).toUpperCase() + id.slice(1);
            const c = document.getElementById('content');
            c.innerHTML = '<div class="flex justify-center mt-20"><div class="loader"></div></div>';

            if(id === 'home') renderHome(c);
            else if(id === 'students') renderList(c, 'getStudents', 'students');
            else if(id === 'teachers') renderList(c, 'getTeachers', 'teachers');
            else if(id === 'approvals') renderApprovals(c);
            else if(id === 'attendance') renderAttendance(c);
            else if(id === 'results') renderResults(c);
            else if(id === 'communication') renderCommunication(c);
            else if(id === 'settings') renderSettings(c);
            else if(id === 'my-performance') renderMyPerformance(c);
        }

        // --- VIEWS ---
        async function renderHome(c) {
            if(!cache.stats) {
                const res = await fetch(`${API_URL}?action=getInitData&role=${currentUser.role}`);
                const d = await res.json();
                cache.stats = d.stats; cache.pending = d.pendingUsers;
            }
            const d = cache.stats;
            
            if(currentUser.role === 'Admin') {
                c.innerHTML = `<div class="grid grid-cols-3 gap-6">
                    <div class="glass-card p-6 border-l-4 border-indigo-500"><h3>Total Students</h3><p class="text-3xl font-bold">${d.students}</p></div>
                    <div class="glass-card p-6 border-l-4 border-blue-500"><h3>Total Teachers</h3><p class="text-3xl font-bold">${d.teachers}</p></div>
                    <div class="glass-card p-6 border-l-4 border-yellow-500"><h3>Pending</h3><p class="text-3xl font-bold">${d.pending}</p></div>
                </div>`;
            } else c.innerHTML = `<div class="glass-card p-10 text-center"><h3>Welcome Back, ${currentUser.name}!</h3></div>`;
        }

        function renderSettings(c) {
            c.innerHTML = `<div class="glass-card p-6 max-w-md"><h3 class="font-bold mb-4">Change Password</h3><form onsubmit="changePass(event)" class="space-y-4">
                <input name="oldPass" placeholder="Current Password" type="password" class="w-full border p-2 rounded" required>
                <input name="newPass" placeholder="New Password" type="password" class="w-full border p-2 rounded" required>
                <button class="bg-indigo-600 text-white w-full py-2 rounded">Update</button>
            </form></div>`;
        }

        // --- (Keep existing renderList, openEdit, submitEdit, submitTeacher, renderAttendance, renderResults, processFile, renderCommunication, sendEmail, renderApprovals, act, filterTable, logout functions from previous version unchanged) ---
        // For brevity, I am including the missing key functions below:

        async function renderList(c, action, type) {
            const res = await fetch(`${API_URL}?action=${action}`);
            const data = await res.json();
            let h = `<div class="flex justify-between mb-4"><input onkeyup="filterTable('dataTable')" id="search" placeholder="Search..." class="border p-2 rounded w-64">
            ${type === 'teachers' && currentUser.role === 'Admin' ? `<button onclick="document.getElementById('teacherModal').classList.remove('hidden')" class="bg-indigo-600 text-white px-4 py-2 rounded">+ Add Teacher</button>` : ''}</div>
            <div class="glass-card overflow-hidden"><table id="dataTable" class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">ID</th><th class="p-3">Name</th><th class="p-3">Info</th><th class="p-3">Action</th></tr></thead><tbody>`;
            data.forEach(r => {
                const id = r.RegNo || r.ID;
                const name = r.FullName || r.Name;
                const extra = r.Course || r.Subject;
                h += `<tr><td class="p-3 font-mono">${id}</td><td class="p-3 font-bold">${name}</td><td class="p-3">${extra}<br><span class="text-xs text-gray-500">${r.Mobile}</span></td>
                <td class="p-3"><button onclick="openEdit('${id}','${name}','${r.Mobile}','${extra}','${type}')" class="text-blue-600 hover:underline">Edit</button></td></tr>`;
            });
            c.innerHTML = h + `</tbody></table></div>`;
        }

        function openEdit(id, name, mobile, extra, type) {
            document.getElementById('editId').value = id;
            document.getElementById('editType').value = type;
            document.getElementById('editName').value = name;
            document.getElementById('editMobile').value = mobile;
            document.getElementById('editExtra').value = extra;
            document.getElementById('editModal').classList.remove('hidden');
        }

        async function submitEdit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const type = document.getElementById('editType').value;
            const name = document.getElementById('editName').value;
            const mobile = document.getElementById('editMobile').value;
            const extra = document.getElementById('editExtra').value;
            const action = type === 'students' ? 'updateStudent' : 'updateTeacher';
            const payload = type === 'students' ? {action, regNo: id, name, mobile, course: extra} : {action, id, name, mobile, subject: extra};
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("Updated Successfully"); document.getElementById('editModal').classList.add('hidden'); loadPage(type);
        }

        async function submitTeacher(e) {
            e.preventDefault(); const fd = new FormData(e.target); const d={action:'registerTeacher'}; fd.forEach((v,k)=>d[k]=v);
            await fetch(API_URL, {method:'POST', body:JSON.stringify(d)}); alert("Added"); document.getElementById('teacherModal').classList.add('hidden'); loadPage('teachers');
        }

        async function renderAttendance(c) {
            c.innerHTML = `<div class="glass-card p-10 text-center"><h3 class="font-bold mb-4">Mark Attendance</h3><button onclick="document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadType').value='Attendance'" class="bg-indigo-600 text-white px-4 py-2 rounded">Bulk Upload</button></div>`;
        }
        function renderResults(c) {
            c.innerHTML = `<div class="glass-card p-10 text-center"><h3 class="font-bold mb-4">Exam Results</h3><button onclick="document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadType').value='Results'" class="bg-indigo-600 text-white px-4 py-2 rounded">Bulk Upload</button></div>`;
        }
        async function renderCommunication(c) {
            const res = await fetch(`${API_URL}?action=getEmailLogs`);
            const logs = await res.json();
            let h = `<div class="flex justify-between mb-6"><h3 class="font-bold text-lg">Email History</h3><button onclick="openEmailModal()" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold">+ Compose</button></div>
            <div class="glass-card overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Date</th><th class="p-3">To</th><th class="p-3">Subject</th><th class="p-3">Status</th></tr></thead><tbody>`;
            logs.reverse().forEach(l => h += `<tr><td class="p-3 text-xs text-gray-500">${l.Date}</td><td class="p-3 font-bold">${l.Recipient}</td><td class="p-3">${l.Subject}</td><td class="p-3 text-green-600 font-bold">${l.Status}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }
        function openEmailModal() { const m = document.createElement('div'); m.className = 'fixed inset-0 bg-black/50 z-50 flex justify-center items-center'; m.innerHTML = `<div class="bg-white p-6 rounded w-[500px]"><h3 class="font-bold mb-4">Send Email</h3><form onsubmit="sendEmail(event)"><select name="target" class="w-full border p-2 mb-2"><option value="all_students">All Students</option><option value="all_teachers">All Teachers</option></select><input name="subject" placeholder="Subject" class="w-full border p-2 mb-2" required><textarea name="body" rows="4" placeholder="Message" class="w-full border p-2 mb-4" required></textarea><div class="flex justify-end gap-2"><button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2">Cancel</button><button class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button></div></form></div>`; document.body.appendChild(m); }
        async function sendEmail(e) { e.preventDefault(); const fd=new FormData(e.target); const d={action:'sendEmail', senderName:currentUser.name}; fd.forEach((v,k)=>d[k]=v); await fetch(API_URL, {method:'POST', body:JSON.stringify(d)}); alert("Emails Sent!"); location.reload(); }
        async function renderApprovals(c) { const data = cache.pending || []; let h = `<div class="glass-card p-4"><h3 class="font-bold mb-4">Requests</h3><table class="w-full text-sm"><tbody>`; if(data.length==0) h += `<tr><td>No pending requests.</td></tr>`; else data.forEach(s => h += `<tr><td class="p-3">${s.name}</td><td class="p-3 text-right"><button onclick="act('${s.regNo}','approveUser')" class="bg-green-100 text-green-700 px-2 rounded mr-2">Approve</button></td></tr>`); c.innerHTML = h + `</tbody></table></div>`; }
        async function act(id, action) { if(confirm("Proceed?")) { await fetch(API_URL, {method:'POST', body:JSON.stringify({action, userId:id})}); loadPage('approvals'); } }
        async function renderMyPerformance(c) { const res = await fetch(`${API_URL}?action=getMyData&regNo=${currentUser.userId}`); const data = await res.json(); let h = `<div class="glass-card p-6 mb-4"><h3 class="font-bold mb-2">My Attendance</h3><table class="w-full text-sm"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>`; data.attendance.forEach(r => h+= `<tr><td>${r.Date}</td><td class="font-bold ${r.Status=='Present'?'text-green-600':'text-red-600'}">${r.Status}</td></tr>`); h += `</tbody></table></div>`; c.innerHTML = h; }
        
        async function processFile() { const file = document.getElementById('fileInput').files[0]; const type = document.getElementById('uploadType').value; const reader = new FileReader(); reader.onload = async (e) => { const workbook = XLSX.read(e.target.result, {type: 'binary'}); const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]); const records = jsonData.map(r => ({ regNo: r.RegNo || r.ID, name: r.Name, status: r.Status || 'Present', exam: r.Exam, course: r.Course, subject: r.Subject, marks: r.Marks, grade: r.Grade })); await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'bulkUpload', type, uploader: currentUser.name, records})}); alert("Uploaded!"); document.getElementById('uploadModal').classList.add('hidden'); }; reader.readAsBinaryString(file); }
        
        function filterTable(id) { const term = event.target.value.toLowerCase(); document.querySelectorAll(`#${id} tbody tr`).forEach(r => r.style.display = r.innerText.toLowerCase().includes(term) ? '' : 'none'); }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
