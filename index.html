<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoooli ERP | Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F3F4F6; }
        .glass { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #EEF2FF; color: #4F46E5; }
        .active-nav { background: #EEF2FF; color: #4F46E5; border-right: 4px solid #4F46E5; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4F46E5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <section id="loginSection" class="fixed inset-0 bg-slate-900 z-50 flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-indigo-700">Schoooli ERP</h1>
                <p class="text-xs text-gray-500">Professional Management System</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <label class="text-xs font-bold text-gray-500">EMAIL / REG NO</label>
                <input type="text" id="uid" class="w-full border p-3 mb-4 rounded bg-gray-50" required>
                <label class="text-xs font-bold text-gray-500">PASSWORD</label>
                <input type="password" id="pass" class="w-full border p-3 mb-4 rounded bg-gray-50" required>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700 transition">LOGIN</button>
            </form>
            <div class="mt-6 text-center border-t pt-4">
                <a href="#" onclick="toggleSection('registerSection')" class="text-sm text-indigo-600 font-bold hover:underline">New Student Registration</a>
            </div>
        </div>
    </section>

    <section id="registerSection" class="fixed inset-0 bg-white z-50 flex justify-center items-center hidden overflow-y-auto">
        <div class="w-full max-w-2xl p-8">
            <h2 class="text-2xl font-bold mb-6 text-indigo-800">Student Registration</h2>
            <form onsubmit="handleRegister(event)" class="grid grid-cols-2 gap-4">
                <input name="regNo" placeholder="Reg No (e.g. 202501)" class="border p-3 rounded" required>
                <input name="fullName" placeholder="Full Name" class="border p-3 rounded" required>
                <input name="email" type="email" placeholder="Email Address" class="border p-3 rounded" required>
                <input name="mobile" placeholder="Mobile Number" class="border p-3 rounded" required>
                <select name="course" class="border p-3 rounded bg-white"><option>BCA</option><option>BSC</option><option>B.COM</option></select>
                <input name="year" placeholder="Year" class="border p-3 rounded" required>
                <input name="password" type="password" placeholder="Create Password" class="border p-3 rounded col-span-2" required>
                <div class="col-span-2 flex gap-4 mt-4">
                    <button type="button" onclick="location.reload()" class="w-1/2 border py-3 rounded font-bold">Cancel</button>
                    <button type="submit" id="regBtn" class="w-1/2 bg-indigo-600 text-white py-3 rounded font-bold">Submit</button>
                </div>
            </form>
        </div>
    </section>

    <div id="app" class="flex w-full hidden">
        <aside class="w-64 bg-white border-r flex flex-col z-10">
            <div class="h-16 flex items-center px-6 border-b font-bold text-xl text-indigo-700">Schoooli</div>
            <nav class="flex-1 overflow-y-auto py-4 space-y-1" id="sidebar"></nav>
            <div class="p-4 border-t">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 font-bold hover:bg-red-50 rounded">Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-gray-50 h-screen">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8 shadow-sm">
                <h2 id="pageTitle" class="text-lg font-bold text-gray-700">Dashboard</h2>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <p class="text-sm font-bold" id="userName">User</p>
                        <p class="text-xs text-gray-500" id="userRole">Role</p>
                    </div>
                    <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold">U</div>
                </div>
            </header>
            <div id="content" class="flex-1 overflow-auto p-8 relative"></div>
        </main>
    </div>

    <script>
        // 🟢 DEPLOYED WEB APP URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbwk4P4Q9DZDJ6ebGI64QLcGw5HONeBhUqDQ5wSnoSSZZ39icw5wxXGgr_3ggtpgplQ/exec";
        
        let currentUser = JSON.parse(localStorage.getItem('user'));
        let cache = {}; // Data Cache

        // INITIALIZE
        if (currentUser) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initDashboard();
        }

        // --- AUTHENTICATION ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<div class="loader mx-auto"></div>`;
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', uid: document.getElementById('uid').value, pass: document.getElementById('pass').value })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data));
                    location.reload();
                } else {
                    alert(data.message);
                    btn.innerText = "LOGIN";
                }
            } catch (err) {
                alert("Connection Failed. Check Internet.");
                btn.innerText = "LOGIN";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn'); btn.innerText = "Registering...";
            const fd = new FormData(e.target); const d = { action: 'registerStudent' };
            fd.forEach((v,k)=>d[k]=v);
            
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(d) });
            const data = await res.json();
            alert(data.message);
            if(data.success) location.reload();
            btn.innerText = "Submit";
        }

        // --- CORE NAVIGATION ---
        function initDashboard() {
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userRole').innerText = currentUser.role;

            const menus = currentUser.role === 'Admin' 
                ? [
                    {id:'home', icon:'fa-chart-pie', label:'Dashboard'},
                    {id:'students', icon:'fa-user-graduate', label:'Students'},
                    {id:'teachers', icon:'fa-chalkboard-user', label:'Teachers'},
                    {id:'approvals', icon:'fa-check-circle', label:'Approvals'},
                    {id:'bulk', icon:'fa-upload', label:'Bulk Data'},
                    {id:'email', icon:'fa-envelope', label:'Communication'}
                  ]
                : [
                    {id:'home', icon:'fa-home', label:'My Dashboard'},
                    {id:'results', icon:'fa-file-alt', label:'My Results'}
                  ];

            const nav = document.getElementById('sidebar');
            nav.innerHTML = menus.map(m => `
                <button onclick="loadPage('${m.id}')" id="nav-${m.id}" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-600 rounded-r-lg mb-1">
                    <i class="fa-solid ${m.icon} w-5"></i> ${m.label}
                </button>
            `).join('');
            
            loadPage('home');
        }

        function loadPage(id) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-nav'));
            document.getElementById(`nav-${id}`)?.classList.add('active-nav');
            document.getElementById('pageTitle').innerText = id.charAt(0).toUpperCase() + id.slice(1);
            
            const c = document.getElementById('content');
            c.innerHTML = `<div class="flex justify-center mt-20"><div class="loader"></div></div>`;

            if(id === 'home') renderHome(c);
            else if(id === 'students') renderList(c, 'getStudents', 'Students');
            else if(id === 'teachers') renderList(c, 'getTeachers', 'Teachers');
            else if(id === 'approvals') renderApprovals(c);
            else if(id === 'bulk') renderBulk(c);
            else if(id === 'email') renderEmail(c);
            else if(id === 'results') renderStudentResults(c);
        }

        // --- DASHBOARD RENDERERS ---
        async function renderHome(c) {
            if(currentUser.role === 'Admin') {
                const res = await fetch(`${API_URL}?action=getInitData&role=Admin`);
                const d = await res.json();
                cache.pending = d.pendingUsers; // Cache pending users for approvals tab
                
                c.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade">
                    <div class="glass p-6 border-l-4 border-indigo-500">
                        <p class="text-xs font-bold text-gray-400 uppercase">Total Students</p>
                        <h3 class="text-3xl font-bold text-gray-800">${d.stats.students}</h3>
                    </div>
                    <div class="glass p-6 border-l-4 border-blue-500">
                        <p class="text-xs font-bold text-gray-400 uppercase">Total Teachers</p>
                        <h3 class="text-3xl font-bold text-gray-800">${d.stats.teachers}</h3>
                    </div>
                    <div class="glass p-6 border-l-4 border-yellow-500">
                        <p class="text-xs font-bold text-gray-400 uppercase">Pending Approvals</p>
                        <h3 class="text-3xl font-bold text-yellow-600">${d.stats.pending}</h3>
                    </div>
                </div>`;
            } else {
                renderStudentHome(c);
            }
        }

        async function renderStudentHome(c) {
            const res = await fetch(`${API_URL}?action=getMyData&regNo=${currentUser.userId}`);
            const data = await res.json();
            
            // Attendance Summary
            let p=0, a=0;
            data.attendance.forEach(r => { if(r.Status==='Present') p++; else a++; });
            
            let h = `<div class="grid grid-cols-2 gap-4 mb-6">
                <div class="glass p-4 text-center border-b-4 border-green-500"><h4 class="text-2xl font-bold">${p}</h4><p class="text-xs text-gray-500">Days Present</p></div>
                <div class="glass p-4 text-center border-b-4 border-red-500"><h4 class="text-2xl font-bold">${a}</h4><p class="text-xs text-gray-500">Days Absent</p></div>
            </div>`;
            
            h += `<div class="glass p-6"><h3 class="font-bold mb-4">Recent Attendance</h3><div class="space-y-2">`;
            data.attendance.slice(-5).reverse().forEach(r => {
                const color = r.Status === 'Present' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                h += `<div class="flex justify-between p-3 rounded bg-gray-50"><span class="text-sm">${r.Date.split(' ')[0]}</span><span class="text-xs font-bold px-2 py-1 rounded ${color}">${r.Status}</span></div>`;
            });
            h += `</div></div>`;
            c.innerHTML = h;
        }

        // --- APPROVALS LOGIC (FIXED) ---
        function renderApprovals(c) {
            const data = cache.pending || [];
            let h = `<div class="glass p-6"><h3 class="font-bold mb-4 text-lg">Pending Registrations</h3>
            <table class="w-full text-sm text-left"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-3">Name</th><th class="p-3">Course</th><th class="p-3 text-right">Action</th></tr></thead><tbody>`;
            
            if (data.length === 0) h += `<tr><td colspan="3" class="p-4 text-center text-gray-400">No pending requests</td></tr>`;
            
            data.forEach(u => {
                h += `<tr>
                    <td class="p-3 font-bold text-gray-700">${u.name}<br><span class="text-xs font-normal text-gray-400">${u.regNo}</span></td>
                    <td class="p-3">${u.course}</td>
                    <td class="p-3 text-right">
                        <button onclick="handleAction('${u.regNo}', 'approveUser')" class="bg-green-100 text-green-700 px-3 py-1 rounded text-xs font-bold hover:bg-green-200">Approve</button>
                    </td>
                </tr>`;
            });
            h += `</tbody></table></div>`;
            c.innerHTML = h;
        }

        async function handleAction(id, action) {
            if(!confirm("Are you sure? This will send an email notification.")) return;
            
            // Optimistic UI: Remove row immediately
            const btn = event.target;
            btn.innerText = "...";
            
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, userId: id }) });
            const data = await res.json();
            
            if(data.success) {
                alert("Success: " + data.message);
                loadPage('home'); // Reload to refresh cache
            } else {
                alert("Error: " + data.message);
            }
        }

        // --- BULK UPLOAD (Excel) ---
        function renderBulk(c) {
            c.innerHTML = `
            <div class="glass p-8 max-w-lg mx-auto text-center">
                <i class="fa-solid fa-cloud-arrow-up text-5xl text-indigo-200 mb-4"></i>
                <h3 class="text-xl font-bold text-gray-700 mb-2">Upload Data</h3>
                <p class="text-sm text-gray-500 mb-6">Supports .xlsx files for Attendance and Results.</p>
                
                <div class="text-left mb-4">
                    <label class="text-xs font-bold text-gray-500">DATA TYPE</label>
                    <select id="uploadType" class="w-full border p-2 rounded mb-4 bg-white"><option value="Attendance">Attendance</option><option value="Results">Exam Results</option></select>
                    <input type="file" id="fileInput" class="w-full border p-2 rounded" accept=".xlsx">
                </div>
                <button onclick="processUpload()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700">Upload & Sync</button>
            </div>`;
        }

        async function processUpload() {
            const file = document.getElementById('fileInput').files[0];
            const type = document.getElementById('uploadType').value;
            if(!file) return alert("Please select a file");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'binary'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                // Normalizing Keys
                const records = jsonData.map(r => ({
                    RegNo: r.RegNo || r.ID,
                    Name: r.Name,
                    Status: r.Status || 'Present',
                    Exam: r.Exam || 'Unit Test',
                    Course: r.Course, Subject: r.Subject, Marks: r.Marks, Grade: r.Grade
                }));

                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'bulkUpload', type: type, uploader: currentUser.name, records: records }) 
                });
                const result = await res.json();
                alert(result.message);
            };
            reader.readAsBinaryString(file);
        }

        // --- UTILS ---
        async function renderList(c, action, title) {
            const res = await fetch(`${API_URL}?action=${action}`);
            const data = await res.json();
            let h = `<div class="glass overflow-hidden"><table class="w-full text-sm text-left"><thead class="bg-gray-50"><tr><th class="p-3">ID</th><th class="p-3">Name</th><th class="p-3">Info</th></tr></thead><tbody>`;
            data.forEach(r => h+=`<tr><td class="p-3 font-mono">${r.RegNo||r.ID}</td><td class="p-3 font-bold">${r.FullName||r.Name}</td><td class="p-3 text-gray-500">${r.Course||r.Subject}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        function toggleSection(id) {
            document.getElementById('loginSection').classList.toggle('hidden');
            document.getElementById(id).classList.toggle('hidden');
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
