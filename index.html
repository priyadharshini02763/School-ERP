<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoooli ERP | Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F3F4FF; }
        .sidebar-active { background-color: #EDE9FE; color: #4F46E5; border-right: 3px solid #4F46E5; }
        .glass-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-800">

    <section id="loginSection" class="h-full flex justify-center items-center bg-gray-900">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 fade-in">
            <h1 class="text-3xl font-bold text-center mb-6 text-indigo-900">Schoooli</h1>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="uid" placeholder="Email or Mobile" class="w-full border p-3 mb-4 rounded bg-gray-50 focus:outline-indigo-500" required>
                <input type="password" id="pass" placeholder="Password" class="w-full border p-3 mb-2 rounded bg-gray-50 focus:outline-indigo-500" required>
                <div class="text-right mb-4"><a href="#" onclick="showSection('forgotSection')" class="text-xs text-indigo-600 font-bold hover:underline">Forgot Password?</a></div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700 transition">LOGIN</button>
            </form>
            <div class="mt-6 text-center text-sm border-t pt-4">
                <a href="#" onclick="showSection('registerSection')" class="text-gray-600 font-bold hover:text-indigo-600">Register New Student</a>
            </div>
        </div>
    </section>

    <section id="registerSection" class="h-full overflow-y-auto p-6 hidden bg-gray-100">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg fade-in my-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-900"><i class="fa-solid fa-user-graduate"></i> Student Registration</h2>
                <button onclick="showSection('loginSection')" class="text-gray-500 hover:text-indigo-600">Back to Login</button>
            </div>
            <form onsubmit="handleRegister(event)" class="space-y-6">
                <div class="bg-indigo-50 p-6 rounded-lg border border-indigo-100">
                    <h3 class="font-bold text-indigo-800 mb-4 text-xs uppercase">Account Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="email" name="email" placeholder="Email (Login ID)" required class="border p-3 rounded w-full">
                        <input type="text" name="mobile" placeholder="Mobile Number" required class="border p-3 rounded w-full">
                        <input type="password" name="password" placeholder="Create Password" required class="border p-3 rounded w-full col-span-2">
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-gray-500 mb-2 text-xs uppercase">Personal Info</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <input type="text" name="regNo" placeholder="Reg No (e.g. 2025001)" required class="border p-3 rounded w-full">
                        <input type="text" name="fullName" placeholder="Full Name" required class="border p-3 rounded w-full">
                        <select name="gender" class="border p-3 rounded w-full bg-white"><option>Male</option><option>Female</option></select>
                        <select name="course" class="border p-3 rounded w-full bg-white"><option>Class 10</option><option>Class 9</option></select>
                        <input type="number" name="year" placeholder="Year" required class="border p-3 rounded w-full">
                    </div>
                </div>
                <div class="bg-gray-50 p-6 rounded-lg border">
                    <h3 class="font-bold text-gray-500 mb-4 text-xs uppercase">Guardian Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="guardianName" placeholder="Guardian Name" required class="border p-3 rounded w-full">
                        <select name="relation" class="border p-3 rounded w-full bg-white"><option>Parent</option><option>Guardian</option></select>
                        <input type="text" name="guardianContact" placeholder="Guardian Contact" required class="border p-3 rounded w-full">
                    </div>
                </div>
                <button type="submit" id="regBtn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded hover:bg-indigo-700 shadow-lg">REGISTER NOW</button>
            </form>
        </div>
    </section>

    <section id="dashboardSection" class="h-full flex overflow-hidden hidden">
        <aside class="w-64 bg-white border-r flex flex-col z-20">
            <div class="h-20 flex items-center px-6 border-b">
                <i class="fa-solid fa-shapes text-indigo-600 text-2xl mr-2"></i>
                <h1 class="text-2xl font-bold text-slate-800">Schoooli</h1>
            </div>
            <nav class="flex-1 overflow-y-auto py-6 space-y-1 px-4" id="sidebarNav"></nav>
            <div class="p-4 border-t"><button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg text-sm font-medium"><i class="fa-solid fa-power-off mr-2"></i> Logout</button></div>
        </aside>
        <div class="flex-1 flex flex-col h-screen overflow-hidden bg-[#F3F4FF]">
            <header class="h-20 bg-white border-b flex items-center justify-between px-8 shadow-sm">
                <h2 id="pageTitle" class="text-xl font-bold text-slate-800">Dashboard</h2>
                <div class="flex items-center gap-3">
                    <div class="text-right hidden md:block"><h4 class="text-sm font-bold" id="userName">User</h4><p class="text-xs text-gray-500" id="userRole">Role</p></div>
                    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold shadow-sm">U</div>
                </div>
            </header>
            <main class="flex-1 overflow-x-hidden overflow-y-auto p-8" id="mainContent"></main>
        </div>
    </section>

    <script>
        // 🟢 PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbwk4P4Q9DZDJ6ebGI64QLcGw5HONeBhUqDQ5wSnoSSZZ39icw5wxXGgr_3ggtpgplQ/exec";

        // Navigation
        function showSection(id) { document.querySelectorAll('section').forEach(el => el.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        
        // Session Check
        const user = JSON.parse(localStorage.getItem('user'));
        if(user) initDashboard(); else showSection('loginSection');

        // --- AUTH ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Verifying...";
            
            try {
                // Using CORS 'no-cors' mode is tricky, standard fetch expects JSON response
                // GAS POST requests follow redirects.
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', uid: document.getElementById('uid').value, pass: document.getElementById('pass').value })
                });
                const data = await res.json();
                
                if(data.success) {
                    localStorage.setItem('user', JSON.stringify(data));
                    location.reload();
                } else {
                    alert(data.message);
                    btn.innerText = "LOGIN";
                }
            } catch(err) {
                alert("Login Error. Check Console.");
                console.error(err);
                btn.innerText = "LOGIN";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            document.getElementById('regBtn').innerText = "Processing...";
            const fd = new FormData(e.target);
            const data = { action: 'registerStudent' };
            fd.forEach((v,k) => data[k] = v);

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await res.json();
            alert(result.message);
            if(result.success) showSection('loginSection');
            document.getElementById('regBtn').innerText = "REGISTER NOW";
        }

        // --- DASHBOARD ---
        function initDashboard() {
            showSection('dashboardSection');
            document.getElementById('userName').innerText = user.name || "User";
            document.getElementById('userRole').innerText = user.role;
            
            const menus = {
                Admin: [
                    {id:'home', icon:'fa-gauge', label:'Dashboard'},
                    {id:'students', icon:'fa-user-graduate', label:'Students'},
                    {id:'teachers', icon:'fa-chalkboard-user', label:'Teachers'},
                    {id:'approvals', icon:'fa-user-check', label:'Approvals'},
                    {id:'email', icon:'fa-envelope', label:'Email Center'}
                ],
                Student: [{id:'home', icon:'fa-gauge', label:'My Dashboard'}]
            };

            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = "";
            (menus[user.role] || menus['Student']).forEach(m => {
                nav.innerHTML += `<button onclick="loadView('${m.id}')" id="nav-${m.id}" class="w-full text-left px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-indigo-600 flex items-center gap-3 font-medium transition mb-1"><i class="fa-solid ${m.icon} w-5"></i> ${m.label}</button>`;
            });
            loadView('home');
        }

        function loadView(id) {
            document.querySelectorAll('#sidebarNav button').forEach(b => b.classList.remove('sidebar-active'));
            document.getElementById('nav-'+id).classList.add('sidebar-active');
            document.getElementById('pageTitle').innerText = document.getElementById('nav-'+id).innerText.trim();
            const c = document.getElementById('mainContent');
            c.innerHTML = `<div class="text-center mt-20 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl"></i><p class="mt-2">Loading...</p></div>`;

            if(id==='home') renderHome(c); 
            else if(id==='students') renderStudents(c);
            else if(id==='approvals') renderApprovals(c);
            else if(id==='email') renderEmailCenter(c);
        }

        // --- RENDERERS ---
        async function renderHome(c) {
            const res = await fetch(API_URL + `?action=getDashboardStats&role=${user.role}`);
            const data = await res.json();
            if(user.role === 'Admin') {
                c.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
                    <div class="glass-card p-6 flex justify-between items-center"><div><p class="text-xs uppercase font-bold text-gray-400">Students</p><h3 class="text-3xl font-bold">${data.students}</h3></div><i class="fa-solid fa-user-graduate text-indigo-100 text-4xl"></i></div>
                    <div class="glass-card p-6 flex justify-between items-center"><div><p class="text-xs uppercase font-bold text-gray-400">Teachers</p><h3 class="text-3xl font-bold">${data.teachers}</h3></div><i class="fa-solid fa-chalkboard-user text-blue-100 text-4xl"></i></div>
                    <div class="glass-card p-6 flex justify-between items-center"><div><p class="text-xs uppercase font-bold text-gray-400">Pending</p><h3 class="text-3xl font-bold text-yellow-500">${data.pending}</h3></div><i class="fa-solid fa-clock text-yellow-100 text-4xl"></i></div>
                </div>`;
            } else c.innerHTML = `<div class="glass-card p-10 text-center"><h3>Welcome back, ${user.name}!</h3></div>`;
        }

        async function renderStudents(c) {
            const res = await fetch(API_URL + `?action=getStudents`);
            const data = await res.json();
            let h = `<div class="glass-card overflow-hidden fade-in"><table class="w-full text-left text-sm text-gray-600"><thead class="bg-gray-50 text-xs uppercase font-bold text-gray-400"><tr><th class="p-4">Reg No</th><th class="p-4">Name</th><th class="p-4">Class</th><th class="p-4">Status</th></tr></thead><tbody class="divide-y">`;
            data.forEach(s => h += `<tr><td class="p-4 font-mono">${s.RegNo}</td><td class="p-4 font-bold">${s.FullName}</td><td class="p-4">${s.Course}</td><td class="p-4"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-bold">${s.Status}</span></td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        async function renderApprovals(c) {
            const res = await fetch(API_URL + `?action=getPendingUsers`);
            const data = await res.json();
            let h = `<div class="glass-card overflow-hidden fade-in p-6"><h3 class="font-bold mb-4">Pending Requests</h3><table class="w-full text-left text-sm text-gray-600"><tbody class="divide-y">`;
            if(data.length===0) h+=`<tr><td class="p-4 text-gray-400">No pending requests.</td></tr>`;
            else data.forEach(s => h += `<tr><td class="p-4 font-bold">${s.name}</td><td class="p-4">${s.course}</td><td class="p-4 text-right"><button onclick="act('${s.regNo}','approveUser')" class="bg-green-500 text-white px-3 py-1 rounded text-xs mr-2">Approve</button><button onclick="act('${s.regNo}','rejectUser')" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Reject</button></td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        async function renderEmailCenter(c) {
            const res = await fetch(API_URL + `?action=getEmailLogs`);
            const data = await res.json();
            let h = `<div class="fade-in space-y-6"><div class="glass-card p-4 flex justify-between bg-indigo-600 text-white rounded-xl"><div><h3 class="font-bold">Email Center</h3></div><button onclick="toggleModal('emailModal')" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-bold shadow">Compose</button></div><div class="glass-card overflow-hidden"><table class="w-full text-left text-sm text-gray-600"><thead class="bg-gray-50 text-xs uppercase font-bold text-gray-400"><tr><th class="p-4">Date</th><th class="p-4">To</th><th class="p-4">Subject</th><th class="p-4">Status</th></tr></thead><tbody class="divide-y">`;
            data.reverse().forEach(l => h += `<tr><td class="p-4">${new Date(l.Date).toLocaleDateString()}</td><td class="p-4">${l.Recipient}</td><td class="p-4">${l.Subject}</td><td class="p-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs">${l.Status}</span></td></tr>`);
            c.innerHTML = h + `</tbody></table></div></div>
            <div id="emailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50"><div class="bg-white p-6 rounded-xl w-full max-w-lg shadow-2xl"><h3 class="font-bold mb-4">Compose</h3><form onsubmit="handleSendEmail(event)" class="space-y-4"><select name="target" class="w-full border p-2 rounded"><option value="single">Single</option><option value="all_students">All Students</option></select><input name="singleEmail" class="w-full border p-2 rounded" placeholder="To:"><input name="subject" class="w-full border p-2 rounded" placeholder="Subject"><textarea name="body" class="w-full border p-2 rounded" placeholder="Message"></textarea><div class="flex justify-end gap-2"><button type="button" onclick="toggleModal('emailModal')" class="px-4 py-2">Cancel</button><button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button></div></form></div></div>`;
        }

        async function act(id, action) { if(confirm("Confirm?")) { await fetch(API_URL, {method:'POST', body:JSON.stringify({action, userId:id})}); loadView('approvals'); } }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        async function handleSendEmail(e) { e.preventDefault(); const fd=new FormData(e.target); const d={action:'sendEmail', senderName:user.name}; fd.forEach((v,k)=>d[k]=v); await fetch(API_URL,{method:'POST', body:JSON.stringify(d)}); alert("Sent"); toggleModal('emailModal'); loadView('email'); }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
