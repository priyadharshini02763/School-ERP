<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schoooli ERP | Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body{font-family:sans-serif;background:#f3f4f6}.active-nav{background:#e0e7ff;color:#4338ca;border-right:4px solid #4338ca}.glass{background:white;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05)}.loader{border:3px solid #f3f3f3;border-top:3px solid #4f46e5;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
</head>
<body class="h-screen flex overflow-hidden text-gray-800">

    <section id="loginView" class="fixed inset-0 bg-slate-900 z-50 flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl w-96 text-center">
            <h1 class="text-3xl font-bold mb-6 text-indigo-900">Schoooli</h1>
            <form onsubmit="doLogin(event)">
                <input id="uid" placeholder="Email / ID" class="w-full border p-3 mb-4 rounded" required>
                <input id="pass" type="password" placeholder="Password" class="w-full border p-3 mb-4 rounded" required>
                <button id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded">LOGIN</button>
            </form>
            <button onclick="document.getElementById('loginView').classList.add('hidden');document.getElementById('regView').classList.remove('hidden')" class="mt-4 text-sm text-indigo-600">Register Student</button>
        </div>
    </section>

    <section id="regView" class="fixed inset-0 bg-white z-50 flex justify-center items-center hidden">
        <div class="w-full max-w-lg p-8 border rounded shadow-xl">
            <h2 class="text-2xl font-bold mb-4">Registration</h2>
            <form onsubmit="doRegister(event)" class="space-y-4">
                <input id="r_reg" placeholder="Reg No" class="w-full border p-2 rounded" required>
                <input id="r_name" placeholder="Full Name" class="w-full border p-2 rounded" required>
                <input id="r_email" placeholder="Email" class="w-full border p-2 rounded" required>
                <input id="r_mob" placeholder="Mobile" class="w-full border p-2 rounded" required>
                <select id="r_course" class="w-full border p-2 rounded"><option>BCA</option><option>BSC</option></select>
                <input id="r_pass" type="password" placeholder="Password" class="w-full border p-2 rounded" required>
                <button class="w-full bg-indigo-600 text-white py-2 rounded">Submit</button>
                <button type="button" onclick="location.reload()" class="w-full text-gray-500 text-sm mt-2">Cancel</button>
            </form>
        </div>
    </section>

    <div id="app" class="flex w-full hidden">
        <aside class="w-64 bg-white border-r flex flex-col">
            <div class="h-16 flex items-center px-6 border-b font-bold text-xl text-indigo-700">Schoooli</div>
            <nav id="nav" class="flex-1 py-4"></nav>
            <button onclick="localStorage.clear();location.reload()" class="p-4 text-red-500 font-bold border-t w-full text-left">Logout</button>
        </aside>
        <main class="flex-1 flex flex-col">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8">
                <h2 id="pageTitle" class="text-lg font-bold">Dashboard</h2>
                <div id="userDisplay" class="font-bold text-sm"></div>
            </header>
            <div id="content" class="flex-1 overflow-auto p-8 bg-gray-50"></div>
        </main>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwk4P4Q9DZDJ6ebGI64QLcGw5HONeBhUqDQ5wSnoSSZZ39icw5wxXGgr_3ggtpgplQ/exec";
        let user = JSON.parse(localStorage.getItem('user'));

        if(user) init();

        // AUTH
        async function doLogin(e) {
            e.preventDefault();
            document.getElementById('loginBtn').innerText = "...";
            const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'login', uid: document.getElementById('uid').value, pass: document.getElementById('pass').value }) });
            const d = await res.json();
            if(d.success) { localStorage.setItem('user', JSON.stringify(d)); location.reload(); }
            else { alert(d.error); document.getElementById('loginBtn').innerText = "LOGIN"; }
        }

        async function doRegister(e) {
            e.preventDefault();
            const d = {
                action: 'registerStudent', regNo: document.getElementById('r_reg').value, fullName: document.getElementById('r_name').value,
                email: document.getElementById('r_email').value, mobile: document.getElementById('r_mob').value,
                course: document.getElementById('r_course').value, password: document.getElementById('r_pass').value
            };
            const res = await fetch(API, { method: 'POST', body: JSON.stringify(d) });
            const r = await res.json(); alert(r.message); if(r.success) location.reload();
        }

        // NAVIGATION
        function init() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = `${user.name} (${user.role})`;

            const menu = user.role === 'Admin' ? 
                ['Dashboard', 'Students', 'Teachers', 'Approvals', 'Email Center'] : ['My Dashboard'];
            
            const nav = document.getElementById('nav');
            nav.innerHTML = menu.map(m => `<button onclick="load('${m}')" class="w-full text-left px-6 py-3 hover:bg-indigo-50 text-sm font-medium text-gray-700">${m}</button>`).join('');
            load(menu[0]);
        }

        async function load(page) {
            document.getElementById('pageTitle').innerText = page;
            const c = document.getElementById('content');
            c.innerHTML = `<div class="flex justify-center mt-20"><div class="loader"></div></div>`;

            let act = '';
            if(page === 'Dashboard') act = 'getDashboard';
            if(page === 'Students') act = 'getStudents';
            if(page === 'Teachers') act = 'getTeachers';
            if(page === 'Approvals') act = 'getApprovals';
            if(page === 'Email Center') act = 'getEmailLogs';
            if(page === 'My Dashboard') act = 'getMyData&regNo='+user.id;

            const res = await fetch(`${API}?action=${act}`);
            const data = await res.json();

            if(page === 'Dashboard') renderDash(data, c);
            if(page === 'Students') renderTable(data, c, 'Students');
            if(page === 'Teachers') renderTable(data, c, 'Teachers');
            if(page === 'Approvals') renderApprovals(data, c);
            if(page === 'Email Center') renderEmail(data, c);
            if(page === 'My Dashboard') renderStudentDash(data, c);
        }

        // RENDERERS
        function renderDash(d, c) {
            c.innerHTML = `<div class="grid grid-cols-3 gap-6">
                <div class="glass p-6 border-l-4 border-blue-500"><h3>Students</h3><p class="text-3xl font-bold">${d.students}</p></div>
                <div class="glass p-6 border-l-4 border-green-500"><h3>Teachers</h3><p class="text-3xl font-bold">${d.teachers}</p></div>
                <div class="glass p-6 border-l-4 border-yellow-500"><h3>Pending</h3><p class="text-3xl font-bold">${d.pending}</p></div>
            </div>`;
        }

        function renderTable(data, c, type) {
            let h = `<div class="glass overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-gray-100"><tr><th class="p-3">ID</th><th class="p-3">Name</th><th class="p-3">Info</th></tr></thead><tbody>`;
            // Using normalized keys: 'id', 'name', 'course' (no more undefined)
            data.forEach(r => h += `<tr><td class="p-3 font-mono">${r.id}</td><td class="p-3 font-bold">${r.name}</td><td class="p-3">${r.course}<br><span class="text-xs text-gray-400">${r.email}</span></td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        function renderApprovals(data, c) {
            if(data.length === 0) { c.innerHTML = `<div class="p-10 text-center text-gray-500">No Pending Requests</div>`; return; }
            let h = `<div class="glass p-6"><h3 class="font-bold mb-4">Requests</h3><div class="space-y-3">`;
            data.forEach(r => {
                h += `<div class="flex justify-between items-center p-3 bg-white border rounded shadow-sm">
                    <div><p class="font-bold">${r.name}</p><p class="text-xs text-gray-500">${r.id} | ${r.course}</p></div>
                    <div class="flex gap-2">
                        <button onclick="act('${r.id}', 'approveUser')" class="bg-green-600 text-white px-3 py-1 rounded text-xs">Approve</button>
                        <button onclick="act('${r.id}', 'rejectUser')" class="bg-red-600 text-white px-3 py-1 rounded text-xs">Reject</button>
                    </div></div>`;
            });
            c.innerHTML = h + `</div></div>`;
        }

        async function act(id, action) {
            if(!confirm("Proceed?")) return;
            const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: action, userId: id }) });
            const d = await res.json();
            alert(d.message);
            load('Approvals'); // Force Refresh
        }

        function renderEmail(data, c) {
            let h = `<div class="glass overflow-hidden"><div class="p-4 border-b flex justify-between"><h3 class="font-bold">History</h3><button onclick="openCompose()" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">+ Compose</button></div><table class="w-full text-left text-sm"><thead class="bg-gray-100"><tr><th class="p-3">To</th><th class="p-3">Subject</th><th class="p-3">Status</th></tr></thead><tbody>`;
            // Logs come as arrays [Date, To, Sub, Status]
            data.reverse().forEach(row => h += `<tr><td class="p-3">${row.To || row.col2}</td><td class="p-3">${row.Subject || row.col3}</td><td class="p-3 font-bold text-green-600">${row.Status || row.col4}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        function openCompose() {
            const m = document.createElement('div');
            m.className = 'fixed inset-0 bg-black/50 flex justify-center items-center z-50';
            m.innerHTML = `<div class="bg-white p-6 rounded w-[500px]"><h3 class="font-bold mb-4">Send Email</h3><form onsubmit="sendEmail(event)"><select name="target" class="w-full border p-2 mb-2 rounded"><option value="all_students">All Students</option><option value="all_teachers">All Teachers</option></select><input name="subject" placeholder="Subject" class="w-full border p-2 mb-2 rounded" required><textarea name="body" rows="4" placeholder="Message" class="w-full border p-2 mb-4 rounded" required></textarea><div class="flex justify-end gap-2"><button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2 text-gray-500">Cancel</button><button class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button></div></form></div>`;
            document.body.appendChild(m);
        }

        async function sendEmail(e) {
            e.preventDefault();
            const fd = new FormData(e.target); const d = { action: 'sendEmail' }; fd.forEach((v,k)=>d[k]=v);
            const res = await fetch(API, { method: 'POST', body: JSON.stringify(d) });
            alert("Sent!"); location.reload();
        }

        function renderStudentDash(d, c) {
            let h = `<div class="glass p-6 mb-4"><h3 class="font-bold border-b pb-2 mb-2">My Attendance</h3><div class="grid grid-cols-7 gap-2 text-xs">`;
            d.attendance.forEach(r => h += `<div class="p-2 text-center rounded ${r.Status=='Present'?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}">${r.Date.split(' ')[0]}<br>${r.Status[0]}</div>`);
            h += `</div></div><div class="glass p-6"><h3 class="font-bold border-b pb-2 mb-2">My Results</h3><table class="w-full text-sm"><thead><tr><th>Exam</th><th>Subject</th><th>Marks</th></tr></thead><tbody>`;
            d.results.forEach(r => h += `<tr><td>${r.ExamTitle}</td><td>${r.Subject}</td><td class="text-center font-bold">${r.Marks}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }
    </script>
</body>
</html>
