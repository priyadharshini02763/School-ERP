<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F1F5F9; }
        .glass-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .active-nav { background: #EEF2FF; color: #4F46E5; border-right: 3px solid #4F46E5; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4F46E5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <section id="loginSection" class="fixed inset-0 bg-slate-900 z-50 flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h1 class="text-3xl font-bold text-center mb-6 text-indigo-900">College ERP</h1>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="uid" placeholder="Email or Mobile" class="w-full border p-3 mb-4 rounded" required>
                <input type="password" id="pass" placeholder="Password" class="w-full border p-3 mb-4 rounded" required>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded">LOGIN</button>
            </form>
            <div class="mt-4 text-center"><a href="#" onclick="showRegister()" class="text-sm text-indigo-600 font-bold">New Student? Register</a></div>
        </div>
    </section>

    <section id="registerSection" class="fixed inset-0 bg-slate-100 z-50 flex justify-center items-center hidden overflow-y-auto">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl my-10">
            <h2 class="text-2xl font-bold mb-6">Student Admission</h2>
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input name="email" placeholder="Email" class="border p-2 rounded" required>
                    <input name="mobile" placeholder="Mobile" class="border p-2 rounded" required>
                    <input name="password" placeholder="Password" type="password" class="border p-2 rounded col-span-2" required>
                    <input name="regNo" placeholder="Reg No" class="border p-2 rounded" required>
                    <input name="fullName" placeholder="Full Name" class="border p-2 rounded" required>
                    <select name="course" class="border p-2 rounded bg-white"><option>BCA</option><option>BSC</option><option>B.COM</option></select>
                    <input name="year" placeholder="Year" type="number" class="border p-2 rounded" required>
                    <input name="guardianName" placeholder="Guardian Name" class="border p-2 rounded" required>
                    <input name="guardianContact" placeholder="Guardian Contact" class="border p-2 rounded" required>
                </div>
                <div class="flex gap-4 mt-4">
                    <button type="button" onclick="location.reload()" class="w-1/2 border py-2 rounded">Cancel</button>
                    <button type="submit" id="regBtn" class="w-1/2 bg-indigo-600 text-white py-2 rounded">Register</button>
                </div>
            </form>
        </div>
    </section>

    <aside class="w-64 bg-white border-r flex flex-col">
        <div class="h-16 flex items-center px-6 border-b font-bold text-xl text-indigo-600">College ERP</div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar"></nav>
        <div class="p-4 border-t"><button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 font-bold">Logout</button></div>
    </aside>

    <main class="flex-1 flex flex-col bg-slate-50">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8">
            <h2 id="pageTitle" class="text-lg font-bold">Dashboard</h2>
            <div id="userDisplay" class="font-bold text-sm">User</div>
        </header>
        <div id="content" class="flex-1 overflow-auto p-8"></div>
    </main>

    <script>
        // 🟢 PASTE URL HERE 🟢
        const API_URL = "https://script.google.com/macros/s/AKfycbwk4P4Q9DZDJ6ebGI64QLcGw5HONeBhUqDQ5wSnoSSZZ39icw5wxXGgr_3ggtpgplQ/exec";
        
        let currentUser = JSON.parse(localStorage.getItem('user'));
        let cache = {}; // Smart caching

        if (currentUser) initApp(); 

        function showRegister() { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('registerSection').classList.remove('hidden'); }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn'); btn.innerText = "Verifying...";
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', uid: document.getElementById('uid').value, pass: document.getElementById('pass').value }) });
                const data = await res.json();
                if(data.success) { localStorage.setItem('user', JSON.stringify(data)); location.reload(); } else { alert(data.message); btn.innerText = "LOGIN"; }
            } catch(e) { alert("Error"); btn.innerText = "LOGIN"; }
        }

        async function handleRegister(e) {
            e.preventDefault();
            document.getElementById('regBtn').innerText = "Processing...";
            const fd = new FormData(e.target); const d = { action: 'registerStudent' }; fd.forEach((v,k)=>d[k]=v);
            const res = await fetch(API_URL, {method:'POST', body:JSON.stringify(d)});
            const r = await res.json();
            alert(r.message); if(r.success) location.reload();
        }

        function initApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userDisplay').innerText = `${currentUser.name} (${currentUser.role})`;
            
            const menu = currentUser.role === 'Admin' || currentUser.role === 'Teacher'
                ? [
                    {id:'home',icon:'fa-chart-pie',l:'Dashboard'}, 
                    {id:'students',icon:'fa-user-graduate',l:'Students'}, 
                    {id:'teachers',icon:'fa-chalkboard-user',l:'Teachers'}, 
                    {id:'approvals',icon:'fa-check',l:'Approvals'}, 
                    {id:'attendance',icon:'fa-calendar-check',l:'Attendance'},
                    {id:'results',icon:'fa-file-alt',l:'Results'},
                    {id:'communication',icon:'fa-envelope',l:'Communication'}
                  ]
                : [{id:'home',icon:'fa-home',l:'My Dashboard'}];

            const nav = document.getElementById('sidebar');
            nav.innerHTML = menu.map(m => `<button onclick="loadPage('${m.id}')" id="btn-${m.id}" class="w-full text-left px-6 py-3 hover:bg-slate-100 flex items-center gap-3"><i class="fa-solid ${m.icon}"></i> ${m.l}</button>`).join('');
            loadPage('home');
        }

        function loadPage(id) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(`btn-${id}`)?.classList.add('active-nav');
            document.getElementById('pageTitle').innerText = id.charAt(0).toUpperCase() + id.slice(1);
            const c = document.getElementById('content');
            c.innerHTML = '<div class="flex justify-center mt-20"><div class="loader"></div></div>';

            if(id === 'home') renderHome(c);
            else if(id === 'students') renderList(c, 'getStudents');
            else if(id === 'teachers') renderList(c, 'getTeachers');
            else if(id === 'approvals') renderApprovals(c);
            else if(id === 'attendance') renderAttendance(c);
            else if(id === 'results') renderResults(c);
            else if(id === 'communication') renderCommunication(c);
        }

        // --- DASHBOARD & LISTS ---
        async function renderHome(c) {
            // Optimized fetch: Get only lightweight stats first
            if(!cache.stats) {
                const res = await fetch(`${API_URL}?action=getInitData&role=${currentUser.role}`);
                const d = await res.json();
                cache.stats = d.stats; cache.pending = d.pendingUsers;
            }
            const d = cache.stats;
            
            if(currentUser.role === 'Admin') {
                c.innerHTML = `<div class="grid grid-cols-3 gap-6">
                    <div class="glass-card p-6 border-l-4 border-indigo-500"><h3>Total Students</h3><p class="text-3xl font-bold">${d.students}</p></div>
                    <div class="glass-card p-6 border-l-4 border-blue-500"><h3>Total Teachers</h3><p class="text-3xl font-bold">${d.teachers}</p></div>
                    <div class="glass-card p-6 border-l-4 border-yellow-500"><h3>Pending</h3><p class="text-3xl font-bold">${d.pending}</p></div>
                </div>`;
            } else {
                // Student View
                const res = await fetch(`${API_URL}?action=getMyData&regNo=${currentUser.userId}`);
                const data = await res.json();
                let h = `<div class="glass-card p-10 text-center mb-6"><h3 class="text-2xl">Welcome Back, ${currentUser.name}!</h3></div>`;
                h += `<div class="glass-card p-6 mb-4"><h3 class="font-bold mb-2">My Attendance</h3><table class="w-full text-sm"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>`;
                data.attendance.forEach(r => h+= `<tr><td>${new Date(r.Date).toLocaleDateString()}</td><td class="font-bold ${r.Status=='Present'?'text-green-600':'text-red-600'}">${r.Status}</td></tr>`);
                h += `</tbody></table></div>`;
                c.innerHTML = h;
            }
        }

        async function renderList(c, action) {
            const res = await fetch(`${API_URL}?action=${action}`);
            const data = await res.json();
            let h = `<div class="flex justify-between mb-4"><input onkeyup="filterTable('dataTable')" id="search" placeholder="Search..." class="border p-2 rounded w-64"></div>
            <div class="glass-card overflow-hidden"><table id="dataTable" class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Name</th><th class="p-3">Info</th><th class="p-3">Contact</th></tr></thead><tbody>`;
            data.forEach(r => h += `<tr><td class="p-3 font-bold">${r.FullName || r.Name}</td><td class="p-3">${r.Course || r.Subject}</td><td class="p-3">${r.Email}<br>${r.Mobile}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        // --- ATTENDANCE ---
        async function renderAttendance(c) {
            const res = await fetch(`${API_URL}?action=getStudents`);
            const students = await res.json();
            
            let h = `<div class="glass-card p-6">
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Mark Attendance (${new Date().toLocaleDateString()})</h3>
                <button onclick="document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadType').value='Attendance'" class="bg-indigo-600 text-white px-4 py-2 rounded">Bulk Upload</button></div>
                <form onsubmit="submitAttendance(event)"><table class="w-full text-sm mb-4"><thead class="bg-slate-100"><tr><th class="p-2 text-left">Name</th><th class="p-2">Status</th></tr></thead><tbody>`;
            students.forEach(s => {
                h += `<tr><td class="p-2">${s.FullName} (${s.RegNo})</td><td class="p-2"><input type="hidden" name="regNo" value="${s.RegNo}"><input type="hidden" name="name" value="${s.FullName}"><input type="hidden" name="course" value="${s.Course}">
                <select name="status" class="border rounded p-1"><option>Present</option><option>Absent</option></select></td></tr>`;
            });
            h += `</tbody></table><button class="bg-green-600 text-white px-4 py-2 rounded">Submit</button></form></div>`;
            c.innerHTML = h;
        }

        async function submitAttendance(e) {
            e.preventDefault(); const form = e.target;
            const regs = form.querySelectorAll('input[name="regNo"]');
            const names = form.querySelectorAll('input[name="name"]');
            const courses = form.querySelectorAll('input[name="course"]');
            const stats = form.querySelectorAll('select[name="status"]');
            let records = [];
            for(let i=0; i<regs.length; i++) records.push({regNo:regs[i].value, name:names[i].value, course:courses[i].value, status:stats[i].value});
            await fetch(API_URL, {method:'POST', body:JSON.stringify({action:'markAttendance', uploader:currentUser.name, records})});
            alert("Marked!");
        }

        // --- RESULTS ---
        function renderResults(c) {
            c.innerHTML = `<div class="glass-card p-6"><h3 class="font-bold mb-4">Exam Results</h3>
            <div class="grid grid-cols-2 gap-4"><div class="border p-4 rounded"><h4>Single Entry</h4><form onsubmit="submitResult(event)" class="space-y-3 mt-2"><input name="regNo" placeholder="Reg No" class="border p-2 w-full" required><input name="name" placeholder="Name" class="border p-2 w-full" required><input name="course" placeholder="Course" class="border p-2 w-full" required><input name="subject" placeholder="Subject" class="border p-2 w-full" required><input name="marks" placeholder="Marks" class="border p-2 w-full" required><input name="grade" placeholder="Grade" class="border p-2 w-full" required><button class="bg-indigo-600 text-white w-full py-2 rounded">Save</button></form></div>
            <div class="border p-4 rounded flex flex-col justify-center items-center"><h4>Bulk Upload</h4><p class="text-xs text-gray-500 mb-4">Upload Excel (.xlsx)</p><button onclick="document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadType').value='Results'" class="bg-green-600 text-white px-6 py-3 rounded">Upload File</button></div></div></div>`;
        }

        async function submitResult(e) {
            e.preventDefault(); const fd=new FormData(e.target); const d={action:'uploadResult', uploader:currentUser.name, exam:'Exam'}; fd.forEach((v,k)=>d[k]=v);
            await fetch(API_URL, {method:'POST', body:JSON.stringify(d)}); alert("Saved!"); e.target.reset();
        }

        // --- COMMUNICATION ---
        async function renderCommunication(c) {
            const res = await fetch(`${API_URL}?action=getEmailLogs`);
            const logs = await res.json();
            let h = `<div class="flex justify-between mb-4"><h3 class="font-bold">Email Center</h3><div class="space-x-2"><button onclick="openEmailModal()" class="bg-indigo-600 text-white px-4 py-2 rounded">+ New Message</button></div></div>
            <div class="glass-card overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Date</th><th class="p-3">To</th><th class="p-3">Subject</th><th class="p-3">Status</th></tr></thead><tbody>`;
            logs.reverse().forEach(l => h += `<tr><td class="p-3">${new Date(l.Date).toLocaleDateString()}</td><td class="p-3 font-bold">${l.Recipient}</td><td class="p-3">${l.Subject}</td><td class="p-3 text-green-600 font-bold">${l.Status}</td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }

        function openEmailModal() {
            const m = document.createElement('div');
            m.className = 'fixed inset-0 bg-black/50 z-50 flex justify-center items-center';
            m.innerHTML = `<div class="bg-white p-6 rounded w-[500px]"><h3 class="font-bold mb-4">Send Email</h3><form onsubmit="sendEmail(event)"><select name="target" class="w-full border p-2 mb-2"><option value="all_students">All Students</option><option value="all_teachers">All Teachers</option><option value="BCA">BCA Students</option><option value="BSC">BSC Students</option></select><input name="subject" placeholder="Subject" class="w-full border p-2 mb-2" required><textarea name="body" rows="4" placeholder="Message" class="w-full border p-2 mb-4" required></textarea><div class="flex justify-end gap-2"><button type="button" onclick="this.closest('.fixed').remove()" class="px-4 py-2">Cancel</button><button class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button></div></form></div>`;
            document.body.appendChild(m);
        }

        async function sendEmail(e) {
            e.preventDefault(); const fd=new FormData(e.target); const d={action:'sendEmail', senderName:currentUser.name}; fd.forEach((v,k)=>d[k]=v);
            await fetch(API_URL, {method:'POST', body:JSON.stringify(d)}); alert("Emails Sent!"); location.reload();
        }

        // --- BULK UPLOAD HANDLER ---
        async function processFile() {
            const file = document.getElementById('fileInput').files[0];
            const type = document.getElementById('uploadType').value;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'binary'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                const records = jsonData.map(r => ({ regNo: r.RegNo, name: r.Name, status: r.Status || 'Present', exam: r.Exam, course: r.Course, subject: r.Subject, marks: r.Marks, grade: r.Grade }));
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'bulkUpload', type, uploader: currentUser.name, records})});
                alert("Uploaded!"); document.getElementById('uploadModal').classList.add('hidden');
            };
            reader.readAsBinaryString(file);
        }

        // --- UTILS ---
        async function renderApprovals(c) {
            const data = cache.pending || [];
            let h = `<div class="glass-card p-4"><h3 class="font-bold mb-4">Requests</h3><table class="w-full text-sm"><tbody>`;
            if(data.length==0) h += `<tr><td>No pending requests.</td></tr>`;
            else data.forEach(s => h += `<tr><td class="p-3">${s.name}</td><td class="p-3 text-right"><button onclick="act('${s.regNo}','approveUser')" class="bg-green-100 text-green-700 px-2 rounded mr-2">Approve</button></td></tr>`);
            c.innerHTML = h + `</tbody></table></div>`;
        }
        async function act(id, action) { if(confirm("Proceed?")) { await fetch(API_URL, {method:'POST', body:JSON.stringify({action, userId:id})}); loadPage('approvals'); } }
        function filterTable(id) { const term = event.target.value.toLowerCase(); document.querySelectorAll(`#${id} tbody tr`).forEach(r => r.style.display = r.innerText.toLowerCase().includes(term) ? '' : 'none'); }
        function logout() { localStorage.clear(); location.reload(); }
    </script>

    <div id="uploadModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-[400px]">
            <h3 class="font-bold mb-4">Upload File</h3>
            <input type="hidden" id="uploadType">
            <input type="file" id="fileInput" class="w-full border p-2 mb-4" accept=".xlsx,.csv">
            <button onclick="processFile()" class="bg-green-600 text-white w-full py-2 rounded">Upload</button>
            <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="mt-2 w-full text-gray-500">Cancel</button>
        </div>
    </div>

</body>
</html>
